<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>图书管理 - 管理员</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; font-size: 14px; }
  .layout { display: flex; height: 100vh; }
  .sidebar { width: 220px; background: #1f2d3d; color: #fff; flex-shrink: 0; }
  .sidebar .logo { padding: 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #2d3e50; }
  .sidebar .menu { padding: 10px 0; }
  .sidebar .menu-item { padding: 14px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; text-decoration: none; color: #ffffff; }
  .sidebar .menu-item:hover { background: #2d3e50; color: #ffffff; }
  .sidebar .menu-item.active { background: #409eff; color: #ffffff; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .header { height: 60px; background: #fff; box-shadow: 0 1px 4px rgba(0,21,41,0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; }
  .header .title { font-size: 16px; font-weight: 600; color: #303133; }
  .header .user { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #606266; cursor: pointer; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #409eff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .content { flex: 1; padding: 20px; overflow: auto; }

  .filter-bar { background: #fff; padding: 18px 20px; border-radius: 8px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .filter-bar input, .filter-bar select { height: 36px; padding: 0 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; outline: none; }
  .filter-bar input:focus, .filter-bar select:focus { border-color: #409eff; }
  .toolbar { background: #fff; padding: 16px 20px; border-radius: 8px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .toolbar .count { color: #606266; }
  .table-card { background: #fff; border-radius: 8px; padding: 16px 20px; overflow-x: auto; }
  table { width: 100%; min-width: 970px; border-collapse: collapse; }
  th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #ebeef5; font-size: 14px; white-space: nowrap; }
  th { background: #f5f7fa; color: #303133; font-weight: 600; }
  tbody tr:hover { background: #f5f7fa; }
  .avail-ok { color: #67c23a; font-weight: 600; }
  .avail-zero { color: #f56c6c; font-weight: 600; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 12px; }
  .tag-success { background: #f0f9eb; color: #67c23a; }
  .tag-info { background: #f4f4f5; color: #909399; }

  .btn { height: 36px; padding: 0 16px; border: 1px solid #dcdfe6; border-radius: 4px; background: #fff; color: #606266; cursor: pointer; font-size: 14px; }
  .btn:hover { color: #409eff; border-color: #c6e2ff; background: #ecf5ff; }
  .btn-primary { background: #409eff; border-color: #409eff; color: #fff; }
  .btn-primary:hover { background: #66b1ff; border-color: #66b1ff; color: #fff; }
  .link-btn { border: none; background: none; cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .link-edit { color: #409eff; }
  .link-del { color: #f56c6c; }

  .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 16px; color: #606266; font-size: 13px; }
  .pagination button { min-width: 30px; height: 30px; border: 1px solid #dcdfe6; background: #fff; border-radius: 4px; cursor: pointer; color: #606266; }
  .pagination button.active { background: #409eff; border-color: #409eff; color: #fff; }
  .pagination button:disabled { color: #c0c4cc; cursor: not-allowed; background: #f5f7fa; }

  /* 弹窗 */
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: flex-start; justify-content: center; padding-top: 8vh; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 8px; width: 640px; }
  .modal-header { padding: 16px 24px; border-bottom: 1px solid #ebeef5; display: flex; justify-content: space-between; align-items: center; }
  .modal-header h3 { font-size: 16px; color: #303133; }
  .modal-close { cursor: pointer; color: #909399; font-size: 18px; border: none; background: none; }
  .modal-body { padding: 20px 24px; max-height: 60vh; overflow-y: auto; }
  .form-row { display: flex; gap: 20px; margin-bottom: 14px; }
  .form-item { flex: 1; }
  .form-item.full { flex: 0 0 100%; }
  .form-item label { display: block; color: #606266; margin-bottom: 6px; font-size: 13px; }
  .form-item label .req { color: #f56c6c; margin-right: 2px; }
  .form-item input, .form-item select, .form-item textarea { width: 100%; height: 36px; padding: 0 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; outline: none; }
  .form-item textarea { height: auto; padding: 8px 12px; resize: vertical; }
  .form-item input:focus, .form-item select:focus, .form-item textarea:focus { border-color: #409eff; }
  .form-item input[readonly] { background: #f5f7fa; color: #909399; cursor: not-allowed; }
  .form-item input.err, .form-item select.err { border-color: #f56c6c; }
  .error-msg { display: none; color: #f56c6c; font-size: 12px; margin-top: 4px; }
  .error-msg.show { display: block; }
  .modal-footer { padding: 12px 24px; border-top: 1px solid #ebeef5; display: flex; justify-content: flex-end; gap: 10px; }

  /* 封面图片字段 */
  .cover-field { display: flex; gap: 16px; align-items: flex-start; }
  .cover-preview { width: 80px; height: 110px; border-radius: 6px; border: 1px solid #e4e7ed; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #fff; background: #909399; overflow: hidden; flex-shrink: 0; }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
  .cover-preview .empty-text { font-size: 12px; color: #c0c4cc; font-weight: normal; }
  .cover-inputs { flex: 1; }
  .cover-inputs .cover-row { margin-bottom: 8px; }
  .cover-inputs input[type=text] { width: 100%; height: 34px; padding: 0 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; outline: none; }
  .cover-inputs input[type=text]:disabled { background: #f5f7fa; color: #c0c4cc; cursor: not-allowed; }
  .cover-inputs input[type=text]:focus { border-color: #409eff; }
  .cover-file-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid #dcdfe6; border-radius: 4px; background: #fff; color: #606266; font-size: 13px; cursor: pointer; }
  .cover-file-btn:disabled { background: #f5f7fa; color: #c0c4cc; cursor: not-allowed; }
  .cover-file-btn:hover:not(:disabled) { color: #409eff; border-color: #c6e2ff; background: #ecf5ff; }
  .cover-file-btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .cover-tip { font-size: 12px; color: #909399; margin-top: 4px; }
  .cover-thumb-mini { width: 36px; height: 50px; border-radius: 4px; object-fit: cover; display: inline-block; vertical-align: middle; }
  .cover-thumb-fallback { width: 36px; height: 50px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; font-weight: bold; vertical-align: middle; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #f0f9eb; border: 1px solid #e1f3d8; color: #67c23a; padding: 10px 20px; border-radius: 6px; display: none; z-index: 2000; }
  .toast.show { display: block; }
  .toast.err { background: #fef0f0; border-color: #fde2e2; color: #f56c6c; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">📚 图书借阅系统</div>
    <div class="menu">
      <a class="menu-item active">📖 图书管理</a>
      <a class="menu-item" href="admin-categories.html">🏷️ 分类管理</a>
      <a class="menu-item" href="admin-records.html">📋 借阅记录</a>
    </div>
  </aside>
  <div class="main">
    <header class="header">
      <div class="title">图书管理</div>
      <div class="user" onclick="location.href='reader-profile.html'">
        <div class="avatar" id="avatarEl">管</div>
        <span id="userText">管理员</span>
      </div>
    </header>
    <div class="content">
      <div class="filter-bar">
        <input type="text" id="kw" placeholder="请输入书名/作者/ISBN" style="width:240px" onkeydown="if(event.key==='Enter')doSearch()" />
        <select id="catFilter" style="width:160px">
          <option value="">全部分类</option>
        </select>
        <button class="btn btn-primary" onclick="doSearch()">搜索</button>
        <button class="btn" onclick="resetSearch()">重置</button>
      </div>
      <div class="toolbar">
        <div class="count">共 <b id="bookCount">0</b> 本图书</div>
        <button class="btn btn-primary" onclick="openDialog('add')">+ 新增图书</button>
      </div>
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th style="width:60px;text-align:center">序号</th>
              <th style="width:140px;min-width:140px">书名</th>
              <th style="width:120px">作者</th>
              <th style="width:70px;text-align:center">封面</th>
              <th style="width:160px">ISBN</th>
              <th style="width:80px">分类</th>
              <th style="width:80px;text-align:center">总馆藏数</th>
              <th style="width:80px;text-align:center">可借数量</th>
              <th style="width:80px;text-align:center">状态</th>
              <th style="width:100px;text-align:center">操作</th>
            </tr>
          </thead>
          <tbody id="bookTbody"></tbody>
        </table>
        <div class="pagination" id="pager"></div>
      </div>
    </div>
  </div>
</div>

<!-- 新增/编辑图书弹窗 -->
<div class="modal-mask" id="bookModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">新增图书</h3>
      <button class="modal-close" onclick="closeDialog()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-item">
          <label><span class="req">*</span> 书名</label>
          <input type="text" id="fTitle" placeholder="请输入书名" />
          <div class="error-msg" id="eTitle">请输入书名</div>
        </div>
        <div class="form-item">
          <label><span class="req">*</span> 作者</label>
          <input type="text" id="fAuthor" placeholder="请输入作者" />
          <div class="error-msg" id="eAuthor">请输入作者</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label><span class="req">*</span> ISBN</label>
          <input type="text" id="fIsbn" placeholder="请输入13位ISBN" maxlength="13" />
          <div class="error-msg" id="eIsbn">请输入ISBN</div>
        </div>
        <div class="form-item">
          <label><span class="req">*</span> 分类</label>
          <select id="fCategory"><option value="">请选择分类</option></select>
          <div class="error-msg" id="eCategory">请选择分类</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label>出版社</label>
          <input type="text" id="fPublisher" placeholder="请输入出版社" />
        </div>
        <div class="form-item">
          <label>出版年份</label>
          <input type="text" id="fYear" placeholder="如：2024" maxlength="4" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label><span class="req">*</span> 总馆藏数</label>
          <input type="number" id="fTotal" min="1" value="1" />
          <div class="error-msg" id="eTotal">总馆藏数至少为 1</div>
        </div>
        <div class="form-item"></div>
      </div>
      <div class="form-row">
        <div class="form-item full">
          <label>封面图片</label>
          <div class="cover-field">
            <div class="cover-preview" id="coverPreview"><span class="empty-text">暂无预览</span></div>
            <div class="cover-inputs">
              <div class="cover-row">
                <button class="cover-file-btn" id="coverFileBtn" onclick="this.querySelector('input').click()">
                  📁 选择图片上传
                  <input type="file" accept="image/jpeg,image/png" onchange="onCoverFile(this)" />
                </button>
                <span class="cover-tip">支持 jpg/png，≤2MB</span>
              </div>
              <div class="cover-row">
                <input type="text" id="fCoverUrl" placeholder="或填写图片URL" oninput="onCoverUrlInput(this.value)" />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item full">
          <label>简介</label>
          <textarea id="fSummary" rows="2" placeholder="请输入图书简介"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeDialog()">取消</button>
      <button class="btn btn-primary" onclick="submitBook()">确定</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-mask" id="delModal">
  <div class="modal" style="width:400px">
    <div class="modal-header">
      <h3>删除图书</h3>
      <button class="modal-close" onclick="closeDel()">×</button>
    </div>
    <div class="modal-body">
      <div style="color:#606266" id="delText"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeDel()">取消</button>
      <button class="btn btn-primary" onclick="confirmDel()">确认删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="shared-data.js"></script>
<script>
// 登录拦截+角色校验：仅管理员可访问；顶栏渲染当前登录用户
LB.requireRole('admin');
LB.renderHeaderUser('avatarEl', 'userText');
</script>
<script>
const PAGE_SIZE = 10;
let filtered = [];
let page = 1;
let editMode = 'add';
let editIsbn = null;
let delIsbn = null;

function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function () { t.className = 'toast' + (isErr ? ' err' : ''); }, 2200);
}

function fillCatSelects() {
  const cats = LB.getCats();
  const opts = '<option value="">全部分类</option>' +
    cats.map(function (c) { return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('');
  document.getElementById('catFilter').innerHTML = opts;
  document.getElementById('fCategory').innerHTML =
    '<option value="">请选择分类</option>' +
    cats.map(function (c) { return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('');
}

function getFiltered() {
  const kw = document.getElementById('kw').value.trim().toLowerCase();
  const cat = document.getElementById('catFilter').value;
  return LB.getBooks().filter(function (b) {
    const okKw = !kw || b.title.toLowerCase().indexOf(kw) >= 0 ||
      b.author.toLowerCase().indexOf(kw) >= 0 || b.isbn.indexOf(kw) >= 0;
    const okCat = !cat || String(b.categoryId) === cat;
    return okKw && okCat;
  });
}

function render() {
  filtered = getFiltered();
  document.getElementById('bookCount').textContent = filtered.length;
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (page > totalPages) page = totalPages;
  const rows = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  const startIdx = (page - 1) * PAGE_SIZE;
  document.getElementById('bookTbody').innerHTML = rows.map(function (b, i) {
    const zero = b.availableCount <= 0;
    const coverHtml = b.cover_url
      ? '<img class="cover-thumb-mini" src="' + b.cover_url + '" alt="封面" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline-flex\'" /><span class="cover-thumb-fallback" style="display:none;background:' + (b.color || '#909399') + '">' + b.title.charAt(0) + '</span>'
      : '<span class="cover-thumb-fallback" style="background:' + (b.color || '#909399') + '">' + b.title.charAt(0) + '</span>';
    return '<tr>' +
      '<td style="text-align:center">' + (startIdx + i + 1) + '</td>' +
      '<td>' + b.title + '</td>' +
      '<td>' + b.author + '</td>' +
      '<td style="text-align:center">' + coverHtml + '</td>' +
      '<td>' + b.isbn + '</td>' +
      '<td>' + LB.catName(b.categoryId) + '</td>' +
      '<td style="text-align:center">' + b.totalCount + '</td>' +
      '<td style="text-align:center"><span class="' + (zero ? 'avail-zero' : 'avail-ok') + '">' + b.availableCount + '</span></td>' +
      '<td style="text-align:center"><span class="tag ' + (zero ? 'tag-info' : 'tag-success') + '">' + (zero ? '已借完' : '在架') + '</span></td>' +
      '<td style="text-align:center">' +
        '<button class="link-btn link-edit" onclick="openDialog(\'edit\',\'' + b.isbn + '\')">编辑</button>' +
        '<button class="link-btn link-del" onclick="askDel(\'' + b.isbn + '\')">删除</button>' +
      '</td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="10" style="text-align:center;color:#909399;padding:30px">暂无数据</td></tr>';
  renderPager(totalPages);
}

function renderPager(totalPages) {
  let html = '<span>共 ' + filtered.length + ' 条</span>';
  html += '<button ' + (page <= 1 ? 'disabled' : '') + ' onclick="goPage(' + (page - 1) + ')">‹</button>';
  for (let i = 1; i <= totalPages; i++) {
    html += '<button class="' + (i === page ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
  }
  html += '<button ' + (page >= totalPages ? 'disabled' : '') + ' onclick="goPage(' + (page + 1) + ')">›</button>';
  document.getElementById('pager').innerHTML = html;
}
function goPage(p) { page = p; render(); }

function doSearch() { page = 1; render(); }
function resetSearch() {
  document.getElementById('kw').value = '';
  document.getElementById('catFilter').value = '';
  page = 1;
  render();
}

/* ---------- 封面图片 ---------- */
let coverData = '';   // 当前弹窗中的封面地址（base64 或 URL）

function renderCoverPreview() {
  var box = document.getElementById('coverPreview');
  if (coverData) {
    box.innerHTML = '<img src="' + coverData + '" alt="封面预览" />';
  } else {
    var book = editIsbn ? LB.getBook(editIsbn) : null;
    var title = document.getElementById('fTitle').value || '?';
    var color = book ? book.color : '#909399';
    box.innerHTML = '<span style="background:' + color + ';width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:6px;">' + title.charAt(0) + '</span>';
  }
}

function onCoverFile(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  // 格式校验
  if (!/image\/(jpeg|png)/.test(file.type)) {
    showToast('仅支持 jpg/png 格式', true);
    input.value = '';
    return;
  }
  // 大小校验
  if (file.size > 2 * 1024 * 1024) {
    showToast('图片大小不能超过2MB', true);
    input.value = '';
    return;
  }
  // FileReader 读取本地预览
  var reader = new FileReader();
  reader.onload = function (e) {
    coverData = e.target.result;
    document.getElementById('fCoverUrl').value = '';
    document.getElementById('fCoverUrl').disabled = true;
    renderCoverPreview();
  };
  reader.readAsDataURL(file);
}

function onCoverUrlInput(val) {
  val = (val || '').trim();
  if (val) {
    coverData = val;
    document.getElementById('coverFileBtn').disabled = true;
  } else {
    coverData = '';
    document.getElementById('coverFileBtn').disabled = false;
  }
  renderCoverPreview();
}

function resetCoverField() {
  coverData = '';
  document.getElementById('fCoverUrl').value = '';
  document.getElementById('fCoverUrl').disabled = false;
  document.getElementById('coverFileBtn').disabled = false;
  var fileInput = document.querySelector('#coverFileBtn input[type=file]');
  if (fileInput) fileInput.value = '';
  renderCoverPreview();
}

/* ---------- 新增/编辑 ---------- */
function clearErrors() {
  ['eTitle', 'eAuthor', 'eIsbn', 'eCategory', 'eTotal'].forEach(function (id) {
    document.getElementById(id).classList.remove('show');
  });
  ['fTitle', 'fAuthor', 'fIsbn', 'fCategory', 'fTotal'].forEach(function (id) {
    document.getElementById(id).classList.remove('err');
  });
}
function openDialog(mode, isbn) {
  editMode = mode;
  clearErrors();
  document.getElementById('modalTitle').textContent = mode === 'add' ? '新增图书' : '编辑图书';
  const isbnInput = document.getElementById('fIsbn');
  if (mode === 'add') {
    editIsbn = null;
    ['fTitle', 'fAuthor', 'fIsbn', 'fPublisher', 'fYear', 'fSummary'].forEach(function (id) {
      document.getElementById(id).value = '';
    });
    document.getElementById('fCategory').value = '';
    document.getElementById('fTotal').value = 1;
    isbnInput.readOnly = false;
    resetCoverField();
  } else {
    const b = LB.getBook(isbn);
    editIsbn = isbn;
    document.getElementById('fTitle').value = b.title;
    document.getElementById('fAuthor').value = b.author;
    document.getElementById('fIsbn').value = b.isbn;
    document.getElementById('fCategory').value = b.categoryId;
    document.getElementById('fPublisher').value = b.publisher || '';
    document.getElementById('fYear').value = b.year || '';
    document.getElementById('fTotal').value = b.totalCount;
    document.getElementById('fSummary').value = b.summary || '';
    isbnInput.readOnly = true;  // ISBN 为业务主键，编辑时锁定
    // 封面回显
    coverData = b.cover_url || '';
    document.getElementById('fCoverUrl').value = b.cover_url || '';
    document.getElementById('fCoverUrl').disabled = !!b.cover_url;
    document.getElementById('coverFileBtn').disabled = !!b.cover_url;
    renderCoverPreview();
  }
  document.getElementById('bookModal').classList.add('show');
}
function closeDialog() { document.getElementById('bookModal').classList.remove('show'); }

function submitBook() {
  clearErrors();
  const title = document.getElementById('fTitle').value.trim();
  const author = document.getElementById('fAuthor').value.trim();
  const isbn = document.getElementById('fIsbn').value.trim();
  const categoryId = document.getElementById('fCategory').value;
  const total = parseInt(document.getElementById('fTotal').value, 10);
  let hasErr = false;
  function mark(field, errId) {
    document.getElementById(field).classList.add('err');
    document.getElementById(errId).classList.add('show');
    hasErr = true;
  }
  if (!title) mark('fTitle', 'eTitle');
  if (!author) mark('fAuthor', 'eAuthor');
  if (!/^\d{13}$/.test(isbn)) { document.getElementById('eIsbn').textContent = '请输入13位数字ISBN'; mark('fIsbn', 'eIsbn'); }
  if (!categoryId) mark('fCategory', 'eCategory');
  if (!(total >= 1)) mark('fTotal', 'eTotal');
  if (hasErr) return;

  const data = {
    title: title, author: author, isbn: isbn, categoryId: Number(categoryId),
    publisher: document.getElementById('fPublisher').value.trim(),
    year: document.getElementById('fYear').value.trim(),
    totalCount: total, summary: document.getElementById('fSummary').value.trim(),
    cover_url: coverData || ''
  };

  if (editMode === 'add') {
    if (LB.getBook(isbn)) {
      document.getElementById('eIsbn').textContent = '该ISBN已存在';
      mark('fIsbn', 'eIsbn');
      return;
    }
    LB.addBook(data);           // 先写 localStorage
    showToast('新增图书成功');
  } else {
    LB.updateBook(editIsbn, data);
    showToast('编辑图书成功');
  }
  closeDialog();
  render();
}

/* ---------- 删除（含借阅状态校验） ---------- */
function askDel(isbn) {
  const b = LB.getBook(isbn);
  // 先从 localStorage 读取借阅记录，校验是否存在「借阅中/逾期」记录
  const active = LB.getRecords().filter(function (r) {
    return r.bookIsbn === isbn && LB.displayStatus(r) !== 'returned';
  });
  if (active.length > 0) {
    showToast('该图书尚有 ' + active.length + ' 册未归还，无法删除', true);
    return;   // 禁止删除，不弹出确认框
  }
  delIsbn = isbn;
  document.getElementById('delText').innerHTML =
    '确认删除该图书吗？<br><span style="color:#909399;font-size:13px">图书「' + b.title + '」（ISBN：' + b.isbn +
    '）删除后读者端不再显示，相关收藏同步移除。</span>';
  document.getElementById('delModal').classList.add('show');
}
function closeDel() { document.getElementById('delModal').classList.remove('show'); }
function confirmDel() {
  LB.deleteBook(delIsbn);       // 先写 localStorage：图书移除 + 收藏级联清理，读者端加载时自动同步
  closeDel();
  showToast('删除成功');
  render();
}

fillCatSelects();
render();
</script>
